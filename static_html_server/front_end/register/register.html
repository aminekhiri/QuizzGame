<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quizzy</title>
  <link rel="stylesheet" href="register.css">
  <link rel="icon" type="image/x-icon" href="../media/brain.png">
</head>
<body>
  <div class="form-container">
    <h1>Register</h1>
    
    <!-- Message d'erreur -->
    <div id="error-message" class="message error-message"></div>
    
    <!-- Message de succès -->
    <div id="success-message" class="message success-message"></div>
    
    <label for="first_name">First name</label>
    <input id="first_name" type="text" required>

    <label for="last_name">Last name</label>
    <input id="last_name" type="text" required>

    <label for="username">username</label>
    <input id="username" type="text" required>

    <label for="password">password</label>
    <div class="password-wrapper">
        <input type="password" placeholder="password" id="password" required>
        <img class="toggle-eye" onclick="togglePassword()" src="../media/eye-open.png" alt="Afficher le mot de passe" draggable="false">
    </div>
    <button id="signup-btn">Sign in</button>
    <p>You already have an account ? <a href="../login/login.html">Log in</a></p>
  </div>

  <script src="register.js" defer></script>
</body>
</html>
